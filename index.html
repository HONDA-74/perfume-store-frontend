<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon and Icons (KENZ official assets) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/src/assets/icons/site.webmanifest" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D1D1B" />
    <meta
      name="description"
      content="KENZ — A treasury of the world's finest fragrances, curated and authenticated."
    />
    <title>KENZ</title>

    <!--
      Font loading strategy (Design_System.md §1.2):
        Display/Headings — Playfair Display (serif)
        Body/Interface   — Plus Jakarta Sans (sans-serif)
      Preconnect first for faster handshake, then load only the weights the
      type scale in Design_System.md actually uses. Swap into src/styles/fonts.css
      for a self-hosted setup once real brand font files are licensed — this
      Google Fonts link is a placeholder wired end-to-end so the scaffold
      renders correctly out of the box.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
